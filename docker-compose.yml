services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quant_engine
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    restart: always
    ports:
      - "6379:6379"

  statarb_engine:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - POSTGRES_URI=postgresql+psycopg2://postgres:password@db:5432/quant_engine
      - REDIS_HOST=redis
      - REDIS_PORT=6379

